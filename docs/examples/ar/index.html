<!-- Import map for CDN production -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm",
            "belowjs": "https://cdn.jsdelivr.net/npm/belowjs@1.9.0/dist/belowjs.js"
        }
    }
    </script>

    <!-- BelowJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/belowjs@1.9.0/dist/belowjs.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #001122;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Hide dive mode toggle - AR only */
        #modeToggleContainer,
        .semantic-toggle {
            display: none !important;
        }
    </style>
    <!-- Analytics script for BelowJS docs site only. Replace/remove for your own deployment. -->
    <script defer data-website-id="f1e6105e-4969-4ffb-a3e1-8d18eca197d7"
        src="https://umami.padmorrison.com/script.js"></script>
</head>
<body>

    <script type="module">
        import { ModelViewer } from 'belowjs';

        // Model configurations
        // Easy per-model scale: 0.01 = 1%, 0.05 = 5%, 1.0 = 100%
        const models = {
          'kxi': {
            url: '../basic/models/kxi.glb',
            name: 'HNLMS K XI (1946)',
            credit: 'WreckSploration',
            defaultScale: 0.05  // 5% - perfect for large shipwrecks
          },
          'sesa': {
            url: '../basic/models/sesa.glb',
            name: 'Sesa',
            credit: 'WreckSploration',
            defaultScale: 0.05  // 5%
          },
          'unknown': {
            url: '../basic/models/unknown.glb',
            name: 'Unknown Wreck',
            credit: 'WreckSploration',
            defaultScale: 0.05  // 5%
          }
        };

        const viewerContainer = document.createElement('div');
        viewerContainer.style.position = 'fixed';
        viewerContainer.style.inset = '0';
        viewerContainer.style.zIndex = '0';
        document.body.appendChild(viewerContainer);

        const viewer = new ModelViewer(viewerContainer, {
          enableVR: false,  // Disable VR to focus on AR
          enableAR: true,   // Enable AR mode
          enableMeasurement: false,  // Disable measurement (conflicts with AR gestures)
          enableDiveSystem: true,  // Enable dive system for survey lighting
          showDiveToggle: false,  // Hide dive toggle - keep in survey mode
          showInfo: true,
          models: models,
          autoLoadFirst: false,
          viewerConfig: {
            scene: {
              background: '#001122'
            },
            ar: {
              enabled: true,
              settings: {
                enableHandTracking: true,
                enableWorldCube: true,
                defaultScale: 0.05,        // 5% scale for models
                worldCubeSize: 1000.0,      // 1000m cube
                worldCubeOpacity: 0.1       // 10% alpha black
              }
            }
          }
        });

        // Log AR session events
        viewer.on('ar-session-start', () => {
          console.log('AR session started!');
        });

        viewer.on('ar-session-end', () => {
          console.log('AR session ended');
        });

        // Log gesture events for debugging
        viewer.on('ar-gesture-start', (gestureType) => {
          console.log(`✋ Gesture started: ${gestureType}`);
        });

        viewer.on('ar-gesture-end', (gestureType) => {
          console.log(`👋 Gesture ended: ${gestureType}`);
        });

        // Example: Disable/enable hand interactions (useful for remote scenarios)
        // viewer.arManager.handTracking.setInteractionEnabled(false); // Lock interactions
        // viewer.arManager.handTracking.setInteractionEnabled(true);  // Unlock interactions

        function initExample() {
          // Load the initial model
          setTimeout(() => {
            console.log('📦 Loading model: kxi');
            viewer.loadModel('kxi');
          }, 100);
        }

        initExample();
    </script>
    <!-- Docs event tracking for this site only. Remove if you are reusing this example elsewhere. -->
    <script src="../../assets/navigation.js"></script>
</body>
</html>
