<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d3b66">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/favicon-16x16.png">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/apple-touch-icon.png">
    <link rel="manifest" href="../../site.webmanifest">
    <meta name="application-name" content="BelowJS">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BelowJS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#0d3b66">
  <title>BelowJS annotations</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm",
      "belowjs": "https://cdn.jsdelivr.net/npm/belowjs@1.10.0/dist/belowjs.js"
    }
  }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/belowjs@1.10.0/dist/belowjs.css">
  <style>
    :root { color-scheme: dark; }
    html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #04111d; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    button { font: inherit; }

    #authoringTools {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 1200;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100vw - 28px);
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid rgba(186, 219, 232, 0.22);
      border-radius: 14px;
      background: rgba(8, 24, 39, 0.78);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px) saturate(1.2);
      transform: translateX(-50%);
    }
    .authoring-status {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 104px;
      padding: 0 10px;
      line-height: 1.2;
    }
    .authoring-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #8fe0c3;
      box-shadow: 0 0 0 4px rgba(143, 224, 195, 0.12);
    }
    .authoring-status strong {
      display: block;
      color: #f4f8fa;
      font-size: 13px;
      font-weight: 700;
    }
    #annotationCount {
      display: block;
      margin-top: 2px;
      color: #9bb2c0;
      font-size: 11px;
      white-space: nowrap;
    }
    .authoring-hint {
      padding: 0 12px;
      border-left: 1px solid rgba(186, 219, 232, 0.16);
      color: #c4d2da;
      font-size: 12px;
      white-space: nowrap;
    }
    .touch-hint { display: none; }
    #download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 9px;
      color: #081725;
      background: #edf5f7;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }
    #download:hover { background: #fff; transform: translateY(-1px); }
    #download:focus-visible { outline: 2px solid #8fe0c3; outline-offset: 3px; }
    #download:disabled { opacity: 0.45; cursor: wait; transform: none; }
    #download svg { width: 15px; height: 15px; }

    #harness {
      position: fixed;
      left: 12px;
      bottom: 84px;
      z-index: 1200;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: min(820px, calc(100vw - 24px));
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid rgba(157, 220, 240, 0.25);
      border-radius: 10px;
      background: rgba(4, 17, 29, 0.9);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
    #harness[hidden] { display: none; }
    #harness button { padding: 8px 12px; border: 1px solid #6997a8; border-radius: 7px; color: #eef9fc; background: #173b4a; }
    #harness button:hover { background: #245569; }
    #stateProbe { width: 100%; max-height: 44px; margin: 0; padding: 7px 9px; overflow: auto; color: #b9dce8; background: rgba(0, 0, 0, 0.24); border-radius: 6px; font: 11px/1.35 ui-monospace, monospace; }

    @media (pointer: coarse) {
      .desktop-hint { display: none; }
      .touch-hint { display: inline; }
    }
    @media (max-width: 640px) {
      #authoringTools { bottom: max(12px, env(safe-area-inset-bottom)); }
      .authoring-hint { display: none; }
      .authoring-status { min-width: 92px; padding: 0 8px; }
      #download { padding: 0 12px; }
      #harness { gap: 6px; }
      #harness button { padding: 7px 9px; font-size: 12px; }
      #harness { max-height: 34vh; overflow-y: auto; }
    }
  </style>
    <!-- Analytics script for BelowJS docs site only. Replace/remove for your own deployment. -->
    <script defer data-website-id="f1e6105e-4969-4ffb-a3e1-8d18eca197d7"
        src="https://umami.padmorrison.com/script.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <div id="authoringTools" aria-label="Annotation authoring tools">
    <div class="authoring-status" aria-live="polite">
      <span class="authoring-dot" aria-hidden="true"></span>
      <span>
        <strong>Authoring</strong>
        <span id="annotationCount">Loading model</span>
      </span>
    </div>
    <span class="authoring-hint">
      <span class="desktop-hint">Right-click the model to add</span>
      <span class="touch-hint">Long-press the model to add</span>
    </span>
    <button id="download" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download JSON
    </button>
  </div>
  <div id="harness" hidden>
    <button id="toggleMode">Use read-only mode</button>
    <button id="toggleVisibility">Hide annotations</button>
    <button id="rapidSwitch">Rapid switch</button>
    <button id="remoteUpdate">Remote update</button>
    <button id="malformed">Malformed JSON</button>
    <button id="reset">Reset fixture</button>
    <pre id="stateProbe">loading</pre>
  </div>
  <script>
    window.addEventListener('error', (event) => {
      document.querySelector('#stateProbe').textContent = `startup-error: ${event.message}`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      const message = event.reason?.message || String(event.reason);
      document.querySelector('#stateProbe').textContent = `unhandled-rejection: ${message}`;
    });
  </script>
  <script type="module">
    import { ModelViewer } from 'belowjs';

    const debugScenarios = new URLSearchParams(window.location.search).has('debug');
    const models = {
      kxi: {
        url: '../basic/models/kxi.glb',
        name: 'HNLMS K XI',
        annotations: './kxi.annotations.json',
        annotationsVisible: true,
        initialPositions: {
          desktop: {
            camera: { x: -6.391, y: 12.461, z: -42.105 },
            target: { x: 1.529, y: 0.088, z: -14.334 }
          }
        }
      }
    };
    if (debugScenarios) {
      Object.assign(models, {
        rapidA: {
          url: '../basic/models/kxi.glb',
          name: 'Rapid switch A',
          annotations: './rapid-a.annotations.json'
        },
        rapidB: {
          url: '../basic/models/kxi.glb',
          name: 'Rapid switch B',
          annotations: './rapid-b.annotations.json'
        }
      });
      document.querySelector('#harness').hidden = false;
    }

    const viewer = new ModelViewer('#viewer', {
      enableVR: true,
      enableScreenshot: true,
      showInfo: true,
      autoLoadFirst: false,
      annotations: {
        mode: 'author',
        showExport: false,
        xr: { enabled: true, interaction: 'select' }
      },
      models
    });

    const stateProbe = document.querySelector('#stateProbe');
    const annotationCount = document.querySelector('#annotationCount');
    const downloadButton = document.querySelector('#download');
    let scenario = 'authoring';
    let lastError = null;
    let remoteSequence = 0;
    const getState = () => ({
      scenario,
      modelKey: viewer.currentModelKey,
      mode: viewer.annotations?.getMode(),
      visible: viewer.annotations?.isVisible(),
      annotations: viewer.annotations?.list().map(({ id, title, position }) => ({ id, title, position })),
      scaleBars: viewer.annotations?.listScaleBars().map(({ id, a, b, label }) => ({ id, a, b, label })),
      lastError
    });
    const updateUi = () => {
      const count = viewer.annotations?.list().length || 0;
      annotationCount.textContent = `${count} annotation${count === 1 ? '' : 's'}`;
      downloadButton.disabled = !viewer.currentModelKey;
      stateProbe.textContent = JSON.stringify(getState());
    };

    document.querySelector('#toggleMode').addEventListener('click', (event) => {
      const mode = viewer.annotations.getMode() === 'view' ? 'author' : 'view';
      viewer.annotations.setMode(mode);
      scenario = mode === 'author' ? 'authoring' : 'read-only';
      event.currentTarget.textContent = mode === 'author' ? 'Use read-only mode' : 'Enable authoring';
      updateUi();
    });
    document.querySelector('#toggleVisibility').addEventListener('click', (event) => {
      const visible = !viewer.annotations.isVisible();
      viewer.annotations.setVisible(visible);
      scenario = visible ? 'visible' : 'hidden';
      event.currentTarget.textContent = visible ? 'Hide annotations' : 'Show annotations';
      updateUi();
    });
    document.querySelector('#rapidSwitch').addEventListener('click', async () => {
      viewer.annotations.setAdapter(null);
      scenario = 'rapid-switch';
      lastError = null;
      const first = viewer.loadModel('rapidA');
      const second = viewer.loadModel('rapidB');
      await Promise.allSettled([first, second]);
      updateUi();
    });
    document.querySelector('#remoteUpdate').addEventListener('click', () => {
      scenario = 'remote-update';
      lastError = null;
      const adapter = {
        listener: null,
        setContext() {},
        requestSnapshot() {},
        send() { return true; },
        subscribe(listener) { this.listener = listener; return () => { this.listener = null; }; },
        dispose() { this.listener = null; }
      };
      viewer.annotations.setAdapter(adapter);
      const annotation = viewer.annotations.list()[0];
      if (annotation) {
        remoteSequence += 1;
        adapter.listener?.({
          type: 'operation',
          data: {
            action: 'edit',
            participant_id: 'remote-fixture',
            annotation: { ...annotation, title: `Remote update ${remoteSequence}` }
          }
        });
      }
      updateUi();
    });
    document.querySelector('#malformed').addEventListener('click', async () => {
      viewer.annotations.setAdapter(null);
      scenario = 'error';
      lastError = null;
      try {
        await viewer.annotations.load({ format: 'invalid-annotations', annotations: [] });
      } catch (error) {
        lastError = error.message;
      }
      updateUi();
    });
    document.querySelector('#reset').addEventListener('click', async () => {
      viewer.annotations.setAdapter(null);
      scenario = 'authoring';
      lastError = null;
      viewer.annotations.setMode('author');
      document.querySelector('#toggleMode').textContent = 'Use read-only mode';
      await viewer.loadModel('kxi');
      updateUi();
    });
    document.querySelector('#download').addEventListener('click', () => viewer.annotations.download());

    window.annotationHarness = {
      viewer,
      getState
    };
    viewer.on('annotations-loaded', updateUi);
    viewer.on('annotation-changed', updateUi);
    viewer.on('annotation-visibility-changed', updateUi);
    viewer.on('annotation-error', ({ error }) => {
      lastError = error?.message || String(error);
      updateUi();
    });
    updateUi();
    viewer.loadModel('kxi').catch((error) => {
      lastError = error.message;
      annotationCount.textContent = 'Model failed to load';
      stateProbe.textContent = JSON.stringify(getState());
    });
  </script>
    <!-- Docs event tracking for this site only. Remove if you are reusing this example elsewhere. -->
    <script src="../../assets/navigation.js"></script>
</body>
</html>
