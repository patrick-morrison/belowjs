<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelowJS - Basic Model Viewer</title>
    <meta name="theme-color" content="#0d3b66">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/favicon-16x16.png">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/apple-touch-icon.png">
    <link rel="manifest" href="../../site.webmanifest">
    <meta name="application-name" content="BelowJS">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BelowJS">
    <meta name="mobile-web-app-capable" content="yes">

<!-- Import map for CDN production -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm",
            "belowjs": "https://cdn.jsdelivr.net/npm/belowjs@1.8.0/dist/belowjs.js"
        }
    }
    </script>
    
    <!-- BelowJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/belowjs@1.8.0/dist/belowjs.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #001122;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
    </style>
    <!-- Analytics script for BelowJS docs site only. Replace/remove for your own deployment. -->
    <script defer data-website-id="f1e6105e-4969-4ffb-a3e1-8d18eca197d7"
        src="https://umami.padmorrison.com/script.js"></script>
</head>
<body>
    <script type="module">
        import { ModelViewer } from 'belowjs';

        // Model configurations
        const models = {
          'kxi': { 
            url: './models/kxi.glb', 
            name: 'HNLMS K XI (1946)', 
            credit: 'WreckSploration',
            initialPositions: {
              desktop: {
                camera: { x: -6.391, y: 12.461, z: -42.105 },
                target: { x: 1.529, y: 0.088, z: -14.334 }
              },
              vr: {
                dolly: { x: 0, y: 2, z: 15 },
                rotation: { x: 0, y: 0, z: 0 }
              }
            }
          },
          'sesa': { 
            url: './models/sesa.glb', 
            name: 'Sesa', 
            credit: 'WreckSploration',
            initialPositions: {
              desktop: {
                camera: { x: 18.93, y: 11.572, z: 52.508 },
                target: { x: -1.613, y: -8.088, z: 4.822 }
              },
              vr: {
                dolly: { x: 0, y: 2, z: 15 },
                rotation: { x: 0, y: 0, z: 0 }
              }
            }
          },
          'unknown': { 
            url: './models/unknown.glb', 
            name: 'Unknown Wreck', 
            credit: 'WreckSploration',
            // Approximate scale for VR exploration only; disable measurements to avoid false precision.
            measurable: false,
            initialPositions: {
              desktop: {
                camera: { x: 34.226, y: 10.354, z: 2.12 },
                target: { x: 10.959, y: -1.07, z: 2.247 }
              },
              vr: {
                dolly: { x: 0, y: 2, z: 15 },
                rotation: { x: 0, y: 0, z: 0 }
              }
            }
          }
        };

        // Initialize viewer with first model
        let currentModel = 'kxi';
        const viewerContainer = document.createElement('div');
        viewerContainer.style.position = 'fixed';
        viewerContainer.style.inset = '0';
        viewerContainer.style.zIndex = '0';
        document.body.appendChild(viewerContainer);

        const viewer = new ModelViewer(viewerContainer, {
          enableVR: true,
          showInfo: true,
          models: models,
          enableVRComfortGlyph: true,
          enableFullscreen: true,
          autoLoadFirst: false,
          enableScreenshot: true,
          enableVRAudio: true,
          audioPath: './sound/',
          viewerConfig: {
            scene: {
              background: '#001122'
            }
          }
        });

        // Explicitly load the initial model (ModelViewer handles dropdown changes internally)
        setTimeout(() => viewer.loadModel(currentModel), 100);
    </script>
    <!-- Docs event tracking for this site only. Remove if you are reusing this example elsewhere. -->
    <script src="../../assets/navigation.js"></script>
</body>
</html>
