<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelowJS - 3D Tiles Example</title>
    <meta name="theme-color" content="#0d3b66">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/favicon-16x16.png">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/apple-touch-icon.png">
    <link rel="manifest" href="../../site.webmanifest">
    <meta name="application-name" content="BelowJS">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BelowJS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#0d3b66">

<!-- Import map for CDN production -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm",
            "belowjs": "https://cdn.jsdelivr.net/npm/belowjs@1.5.0/dist/belowjs.js"
        }
    }
    </script>

    <!-- BelowJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/belowjs@1.5.0/dist/belowjs.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #001122;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #viewer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #infoTitle.tileset-info-title {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            line-height: 1.1;
        }

        #infoTitle.tileset-info-title .tileset-info-title__brand {
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
        }

        #infoTitle.tileset-info-title .tileset-info-title__site {
            font-size: 0.9rem;
            font-weight: 700;
            color: #dbeafe;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <script type="module">
        import { ModelViewer } from 'belowjs';

        const DEFAULT_TILESET_URL = 'https://raw.githubusercontent.com/patrick-morrison/dentonholme-tiled/main/DentonHolmeMacedon2023_tiles/tileset.json';
        const FALLBACK_TILESET_URL = 'https://raw.githubusercontent.com/CesiumGS/3d-tiles-samples/main/1.0/TilesetWithDiscreteLOD/tileset.json';

        const params = new URLSearchParams(window.location.search);
        const tilesetUrl = params.get('url') || DEFAULT_TILESET_URL;
        const isNasaAmmosTileset = /NASA-AMMOS\/3DTilesSampleData/i.test(tilesetUrl);
        const isLikelyMetashapeTileset = /(?:^|[\/\\])[^/?#]*\.psx(?:[_./-]|$)|_psx_tiles/i.test(tilesetUrl);
        const upAxis = params.get('up') || (isNasaAmmosTileset ? '-Z' : (isLikelyMetashapeTileset ? '+Z' : '+Y'));
        const modelName = params.get('name') || 'Denton Holme and Macedon 2023';
        const modelCredit = params.get('credit') || (tilesetUrl === FALLBACK_TILESET_URL ? 'CesiumGS' : 'WreckSploration');

        const viewer = new ModelViewer('#viewer', {
            showInfo: true,
            enableVR: true,
            enableScreenshot: true,
            enableFullscreen: true,
            models: {
                tileset: {
                    url: tilesetUrl,
                    type: 'tileset',
                    name: modelName,
                    credit: modelCredit,
                    up: upAxis,
                    autoCenter: true,
                    maxTriangles: 1000000,
                    errorTarget: 12,
                    maxDepth: 25,
                    loadSiblings: true,
                    optimizedLoadStrategy: true,
                    maxTilesProcessed: 512
                }
            },
            viewerConfig: {
                scene: {
                    background: '#001122',
                    fog: { enabled: false }
                },
                renderer: {
                    logarithmicDepthBuffer: true
                }
            }
        });

        const applyCustomInfoTitle = () => {
            const infoTitle = document.getElementById('infoTitle');
            if (!infoTitle) return;
            infoTitle.classList.add('tileset-info-title');
            infoTitle.innerHTML = `
                <span class="tileset-info-title__brand">BelowJS Tiled Model Streaming</span>
                <span class="tileset-info-title__site">Denton Holme and Macedon Wrecks 2023</span>
            `;
        };

        applyCustomInfoTitle();
        viewer.on('initialized', applyCustomInfoTitle);
    </script>
</body>
</html>
