<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelowJS - 3D Tiles Example</title>
    <meta name="theme-color" content="#0d3b66">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/favicon-16x16.png">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/apple-touch-icon.png">
    <link rel="manifest" href="../../site.webmanifest">
    <meta name="application-name" content="BelowJS">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BelowJS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#0d3b66">

<!-- Import map for CDN production -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm",
            "belowjs": "https://cdn.jsdelivr.net/npm/belowjs@1.7.2/dist/belowjs.js"
        }
    }
    </script>

    <!-- BelowJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/belowjs@1.7.2/dist/belowjs.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #001122;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #viewer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #infoTitle.tileset-info-title {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            line-height: 1.1;
        }

        #infoTitle.tileset-info-title .tileset-info-title__brand {
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
        }

        #infoTitle.tileset-info-title .tileset-info-title__site {
            font-size: 0.9rem;
            font-weight: 700;
            color: #dbeafe;
        }
    </style>
    <!-- Analytics script for BelowJS docs site only. Replace/remove for your own deployment. -->
    <script defer data-website-id="f1e6105e-4969-4ffb-a3e1-8d18eca197d7"
        src="https://umami.padmorrison.com/script.js"></script>
</head>
<body>
    <div id="viewer"></div>

    <script type="module">
        import { ModelViewer } from 'belowjs';

        const DEFAULT_TILESET_URL = 'https://raw.githubusercontent.com/patrick-morrison/dentonholme-tiled/main/DentonHolmeMacedon2023_tiles/tileset.json';
        const params = new URLSearchParams(window.location.search);
        const tilesetUrl = params.get('url') || DEFAULT_TILESET_URL;
        const upAxis = params.get('up') || '+Y';

        const viewer = new ModelViewer('#viewer', {
            showInfo: true,
            enableVR: true,
            enableScreenshot: true,
            enableFullscreen: true,
            models: {
                tileset: {
                    url: tilesetUrl,
                    type: 'tileset',
                    name: 'Tiled Datest',
                    credit: 'Denton Holme and Macedon 2023',
                    up: upAxis,
                    autoCenter: true,
                    initialPositions: {
                        desktop: {
                            camera: { x: 74.088, y: -108.156, z: -12.676 },
                            target: { x: 71.603, y: -110.98, z: -9.382 }
                        },
                        vr: {
                            dolly: { x: 74.088, y: -108.156, z: -12.676 },
                            rotation: { x: 0, y: 2.495, z: 0 }
                        }
                    }
                }
            },
            viewerConfig: {
                scene: {
                    background: '#001122',
                    fog: { enabled: false }
                },
                renderer: {
                    logarithmicDepthBuffer: true
                }
            }
        });

        const applyCustomInfoTitle = () => {
            const infoTitle = document.getElementById('infoTitle');
            if (!infoTitle) return;
            infoTitle.classList.add('tileset-info-title');
            infoTitle.innerHTML = `
                <span class="tileset-info-title__brand">BelowJS Tiled Model Streaming</span>
                <span class="tileset-info-title__site">Denton Holme and Macedon Wrecks 2023</span>
            `;
        };

        applyCustomInfoTitle();
        viewer.on('initialized', applyCustomInfoTitle);
    </script>
    <!-- Docs event tracking for this site only. Remove if you are reusing this example elsewhere. -->
    <script src="../../assets/navigation.js"></script>
</body>
</html>
